<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>無限階段 練習</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d1a;overflow:hidden;
    touch-action:manipulation;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .btn{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));width:42vw;max-width:260px;height:26vh;max-height:200px;
    border-radius:26px;color:#fff;font-size:26px;font-weight:800;letter-spacing:.04em;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.35;
    touch-action:none;border:1.5px solid #ffffff55;
    box-shadow:0 8px 28px var(--glow),inset 0 1px 0 #ffffff66,inset 0 -14px 24px #00000040;
    text-shadow:0 2px 6px #0006;transition:transform .06s,filter .06s}
  .btn small{display:block;font-size:12px;font-weight:500;opacity:.85;letter-spacing:0}
  .btn.on{transform:scale(.95);filter:brightness(1.35);box-shadow:0 2px 12px var(--glow),inset 0 1px 0 #fff8}
  #ctrl{left:max(16px,env(safe-area-inset-left));--glow:#8b4fe666;background:linear-gradient(160deg,#a56cf5,#5b2ab0)}
  #space{right:max(16px,env(safe-area-inset-right));--glow:#2aa0f066;background:linear-gradient(160deg,#4fc0ff,#1766c2)}
  #mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:44px;height:44px;
    border-radius:50%;border:1.5px solid #ffffff44;background:#ffffff18;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none}
  #rank{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));width:44px;height:44px;
    border-radius:50%;border:1.5px solid #ffffff44;background:#ffffff18;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none}
  #panel{position:fixed;inset:0;z-index:20;background:#05060ccc;display:none;align-items:center;justify-content:center;touch-action:auto}
  #panel .card{width:min(88vw,340px);background:linear-gradient(#1c1f45,#10122a);border:1.5px solid #ffffff33;border-radius:20px;padding:18px;color:#fff;box-shadow:0 10px 40px #0008}
  #panel h2{margin:0 0 10px;font-size:20px;text-align:center}
  #list{list-style:none;margin:0 0 12px;padding:0;min-height:60px;font-size:15px}
  #list li{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px}
  #list li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #list li:nth-child(odd){background:#ffffff0d}
  #list li.me{background:#ffd24a33;color:#ffe38a}
  #panel .row{display:flex;gap:8px}
  #name{flex:1;min-width:0;font-size:16px;padding:10px;border-radius:10px;border:1px solid #ffffff44;background:#0006;color:#fff;-webkit-user-select:text;user-select:text}
  #panel button{font-size:15px;font-weight:700;padding:10px 14px;border-radius:10px;border:0;color:#fff;background:linear-gradient(160deg,#4fc0ff,#1766c2)}
  #panel #close{display:block;width:100%;margin-top:12px;background:#ffffff22}
  #stat{margin:10px 0 0;font-size:12px;color:#a9b2f0;text-align:center;min-height:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="mute">🔊</div>
<div id="rank">🏆</div>
<div id="panel"><div class="card">
  <h2>🏆 ランキング</h2>
  <ul id="list"></ul>
  <div class="row"><input id="name" maxlength="12" placeholder="ニックネーム" autocomplete="off"><button id="save">保存</button></div>
  <p id="stat"></p>
  <button id="close">閉じる</button>
</div></div>
<div class="btn" id="ctrl">Ctrl<small>方向転換して1段</small></div>
<div class="btn" id="space">Space<small>そのまま1段</small></div>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

// ズーム防止
['gesturestart','gesturechange','gestureend','contextmenu','dblclick'].forEach(e=>
  document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
let lastTouch=0;
document.addEventListener('touchend',e=>{if(e.target.closest&&e.target.closest('#panel'))return;const n=Date.now();if(n-lastTouch<350)e.preventDefault();lastTouch=n},{passive:false});
document.addEventListener('touchmove',e=>{if(e.target.closest&&e.target.closest('#panel'))return;e.preventDefault()},{passive:false});

// ---------- 効果音(WebAudioで合成。Ctrl用とSpace用の2種類だけ) ----------
let ac=null,muted=false;
try{muted=localStorage.getItem('mugen_mute')==='1'}catch(e){}
const muteEl=document.getElementById('mute');
muteEl.textContent=muted?'🔇':'🔊';
function audioInit(){
  if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A()}
  if(ac&&ac.state==='suspended')ac.resume();
}
function tone(f,d,type,vol,f2){
  if(muted||!ac)return;
  const t=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.008);
  gn.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(gn).connect(ac.destination);o.start(t);o.stop(t+d+.02);
}
const sfxSpace=()=>tone(780,.09,'triangle',.2);          // 高めの「ポッ」
const sfxCtrl=()=>tone(300,.12,'square',.09,520);        // 低め→上がる「ブッ」
muteEl.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();muted=!muted;
  muteEl.textContent=muted?'🔇':'🔊';try{localStorage.setItem('mugen_mute',muted?'1':'0')}catch(_){}
  audioInit();sfxSpace()});

// ---------- ゲーム状態 ----------
const SW=73,SH=30,SR=9; // 階段の幅(1.3倍)・高さ・角丸
let dirs,n,face,state,timer,limit,best,reason,lockUntil,camX,camY,shake;
let vx,vy,hop,fx,fy,fv,parts;
try{best=+localStorage.getItem('mugen_best')||0}catch(e){best=0}
const stars=Array.from({length:50},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.4,z:Math.random()*.25+.05}));
function limitFor(k){return .35+2.65*Math.exp(-k/70)}
function reset(){dirs=[1];n=0;face=1;state='ready';timer=0;limit=0;reason='';camX=0;camY=0;shake=0;
  vx=0;vy=0;hop=0;fx=0;fy=0;fv=0;parts=[];
  while(dirs.length<60)dirs.push(Math.random()<.5?1:-1)}
function stairX(k){let x=0;for(let i=0;i<k;i++)x+=dirs[i];return x}
function burst(x,y,col,cnt,sp){
  for(let i=0;i<cnt;i++){const a=Math.random()*6.283,s=Math.random()*sp;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*.4,life:1,col})}}
function fail(r){state='over';reason=r;lockUntil=performance.now()+450;shake=1;fv=-120;
  burst(vx,vy,'#ff6b6b',26,200);
  if(n>best){best=n;try{localStorage.setItem('mugen_best',best)}catch(e){}}
  onGameOver()}

// ---------- ランキング(Firebase Firestore) ----------
// Firebaseの設定を貼ると有効になります(nullの間はランキング機能は非表示)
const FIREBASE_CONFIG=null;
const panel=document.getElementById('panel'),rankBtn=document.getElementById('rank'),
  listEl=document.getElementById('list'),nameEl=document.getElementById('name'),
  statEl=document.getElementById('stat');
let panelOpen=false,fb=null,myName='',lastKey='',asked=false;
try{myName=localStorage.getItem('mugen_name')||''}catch(e){}
nameEl.value=myName;
if(!FIREBASE_CONFIG)rankBtn.style.display='none';
const FB='https://www.gstatic.com/firebasejs/10.12.2/';
async function fbInit(){
  if(!FIREBASE_CONFIG)return null;
  if(fb)return fb;
  try{
    const [A,Au,F]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
    const app=A.initializeApp(FIREBASE_CONFIG),auth=Au.getAuth(app);
    await Au.signInAnonymously(auth);
    fb={F,db:F.getFirestore(app),uid:auth.currentUser.uid};
  }catch(e){console.warn(e);statEl.textContent='ランキングに接続できません'}
  return fb;
}
async function loadRank(){
  listEl.textContent='読み込み中…';
  if(!await fbInit()){listEl.textContent='';return}
  try{
    const {F,db}=fb;
    const snap=await F.getDocs(F.query(F.collection(db,'scores'),F.orderBy('score','desc'),F.limit(10)));
    listEl.textContent='';let i=0;
    snap.forEach(d=>{i++;const v=d.data(),li=document.createElement('li');
      if(d.id===fb.uid)li.className='me';
      const a=document.createElement('span'),b=document.createElement('b');
      a.textContent=i+'. '+v.name;b.textContent=v.score+'段';li.append(a,b);listEl.append(li)});
    if(!i)listEl.textContent='まだ記録がありません';
  }catch(e){console.warn(e);listEl.textContent='';statEl.textContent='ランキングを取得できません'}
}
async function submit(){
  const key=best+'|'+myName;
  if(!FIREBASE_CONFIG||!myName||best<1||key===lastKey)return;
  if(!await fbInit())return;
  try{
    const {F,db,uid}=fb,ref=F.doc(db,'scores',uid),old=await F.getDoc(ref);
    const sc=Math.max(best,old.exists()?old.data().score:0);
    if(!old.exists()||old.data().score!==sc||old.data().name!==myName)
      await F.setDoc(ref,{name:myName,score:sc,t:F.serverTimestamp()});
    lastKey=key;statEl.textContent='ランキングに登録しました';
  }catch(e){console.warn(e);statEl.textContent='登録に失敗しました'}
}
function openPanel(ask){
  panelOpen=true;panel.style.display='flex';
  statEl.textContent=ask?'名前を入れるとランキングに参加できます':'';
  loadRank();
}
function onGameOver(){
  if(!FIREBASE_CONFIG)return;
  if(!myName){
    if(!asked&&n>=1){asked=true;setTimeout(()=>{if(state==='over')openPanel(true)},900)}
    return;
  }
  submit();
}
rankBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audioInit();openPanel(false)});
document.getElementById('close').addEventListener('click',()=>{panelOpen=false;panel.style.display='none'});
document.getElementById('save').addEventListener('click',async()=>{
  const v=nameEl.value.trim().slice(0,12);
  if(!v){statEl.textContent='名前を入力してください';return}
  myName=v;try{localStorage.setItem('mugen_name',v)}catch(e){}
  if(best<1){statEl.textContent='名前を保存しました(記録が出ると登録されます)';return}
  statEl.textContent='登録中…';await submit();await loadRank();
});

function act(turn){
  if(panelOpen)return;
  audioInit();
  turn?sfxCtrl():sfxSpace();
  const now=performance.now();
  if(state==='over'){if(now>lockUntil)reset();return}
  if(turn)face=-face;
  if(dirs[n]!==face){fail('階段のない方向です');return}
  n++;state='play';hop=1;
  burst(stairX(n)*SW,-n*SH,turn?'#b98cff':'#7fd0ff',n%10===0?22:9,n%10===0?170:90);
  while(dirs.length<n+60)dirs.push(Math.random()<.5?1:-1);
  limit=limitFor(n);timer=limit;
}

// 入力: ボタン
function bind(id,turn){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');act(turn)});
  const up=()=>el.classList.remove('on');
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,up));
}
bind('ctrl',true);bind('space',false);
// 入力: キーボード
addEventListener('keydown',e=>{
  if(e.repeat||(e.target&&e.target.tagName==='INPUT'))return;
  if(e.key==='Control'||e.code==='ControlLeft'||e.code==='ControlRight'){e.preventDefault();act(true)}
  else if(e.code==='Space'){e.preventDefault();act(false)}
});

let prev=performance.now();
function loop(t){
  const dt=Math.min((t-prev)/1000,.1);prev=t;
  if(state==='play'){timer-=dt;if(timer<=0){timer=0;fail('時間切れ')}}
  shake=Math.max(0,shake-dt*3);
  hop=Math.max(0,hop-dt*6);
  const tx=stairX(n)*SW,ty=-n*SH;
  vx+=(tx-vx)*Math.min(1,dt*22);vy+=(ty-vy)*Math.min(1,dt*22);
  if(state==='over'){fv+=dt*900;fy+=fv*dt;fx+=face*dt*40}
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=dt*320;p.life-=dt*2.2}
  parts=parts.filter(p=>p.life>0);
  draw();requestAnimationFrame(loop);
}

function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}

function draw(){
  // 背景
  const bg=g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1d1a44');bg.addColorStop(.55,'#121634');bg.addColorStop(1,'#080a16');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  const gl=g.createRadialGradient(W/2,H*.45,0,W/2,H*.45,H*.6);
  gl.addColorStop(0,'#5a4bd433');gl.addColorStop(1,'#5a4bd400');
  g.fillStyle=gl;g.fillRect(0,0,W,H);
  camX+=(vx-camX)*.18;camY+=(vy-camY)*.18;
  const tw=performance.now()/1000;
  for(const s of stars){
    const sy=((s.y*H-camY*s.z)%H+H)%H,sx=((s.x*W-camX*s.z*.5)%W+W)%W;
    g.globalAlpha=.35+.35*Math.sin(tw*2+s.x*20);
    g.fillStyle='#fff';g.beginPath();g.arc(sx,sy,s.r,0,7);g.fill();
  }
  g.globalAlpha=1;

  const ox=W/2-camX+(shake?Math.sin(performance.now()/20)*shake*6:0);
  const oy=H*.5-camY;

  // 階段(平面・角丸グラデーション)
  const from=Math.max(0,n-8),to=n+14;
  for(let k=to;k>=from;k--){
    const x=ox+stairX(k)*SW-SW/2+3,y=oy-k*SH,w=SW-6,h=SH-6;
    const cur=k===n,past=k<n,ms=k%10===0&&k>0;
    g.globalAlpha=(past?.5:1)*(k>n+9?Math.max(0,1-(k-n-9)/6):1);
    let c1,c2;
    if(cur){c1='#fff2a8';c2='#ffb52e'}
    else if(ms){c1='#ffe9a0';c2='#e0a43a'}
    else{c1='#a9b6ff';c2='#5f6ed6'}
    const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,c1);gr.addColorStop(1,c2);
    g.fillStyle=gr;
    if(cur){g.shadowColor='#ffc83d';g.shadowBlur=24}
    rr(x,y,w,h,SR);g.fill();
    g.shadowBlur=0;
    // 上辺のハイライト
    g.fillStyle='#ffffff55';rr(x+6,y+2,w-12,3,1.5);g.fill();
    if(ms){g.fillStyle='#5a3a00';g.font='bold 13px sans-serif';g.textAlign='center';g.fillText(k,x+w/2,y+h-7)}
    g.globalAlpha=1;
  }

  // プレイヤー
  const over=state==='over';
  const jump=Math.sin(Math.PI*(1-hop))*(hop>0?14:0);
  const x=ox+vx+fx,y=oy+vy+fy-jump-4;
  if(!over){g.fillStyle='#00000066';g.beginPath();g.ellipse(ox+vx,oy+vy+SH-8,14-jump*.3,4,0,0,7);g.fill()}
  const sq=hop>0?1+.12*Math.sin(Math.PI*hop):1;
  g.save();g.translate(x,y);g.scale(1/sq,sq);
  const pg=g.createRadialGradient(-4,-18,2,0,-12,14);
  pg.addColorStop(0,over?'#ffb0b0':'#ffffff');pg.addColorStop(1,over?'#d23a3a':'#9fb4ff');
  g.fillStyle=pg;g.beginPath();g.arc(0,-12,12,0,7);g.fill();
  g.fillStyle='#1a1d3a';g.beginPath();g.arc(face*5,-14,3,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(face*5.8,-15,1,0,7);g.fill();
  g.restore();
  // 向きの矢印
  if(!over){
    g.fillStyle='#ffd24a';g.font='bold 18px sans-serif';g.textAlign='center';
    g.shadowColor='#ffb52e';g.shadowBlur=10;
    g.fillText(face>0?'▶':'◀',ox+vx+face*40,oy+vy-6);g.shadowBlur=0;
  }
  // パーティクル
  for(const p of parts){
    g.globalAlpha=Math.max(0,p.life);g.fillStyle=p.col;
    g.beginPath();g.arc(ox+p.x,oy+p.y-10,2.4*p.life+.6,0,7);g.fill();
  }
  g.globalAlpha=1;

  // HUD
  g.textAlign='center';
  g.shadowColor='#7f8cff';g.shadowBlur=18;
  g.fillStyle='#fff';g.font='800 52px system-ui,sans-serif';
  g.fillText(n,W/2,62);g.shadowBlur=0;
  g.fillStyle='#b8c0ff';g.font='600 12px system-ui,sans-serif';
  g.fillText('BEST '+best,W/2,84);
  const bw=Math.min(W-48,340),bx=(W-bw)/2,by=98;
  g.fillStyle='#ffffff1c';rr(bx,by,bw,10,5);g.fill();
  if(state==='play'){
    const r=Math.max(0,timer/limit);
    const col=r>.5?['#7bf0a8','#2ec27a']:r>.25?['#ffe27a','#f0b020']:['#ff8a8a','#e03a3a'];
    const bgx=g.createLinearGradient(bx,0,bx+bw,0);bgx.addColorStop(0,col[0]);bgx.addColorStop(1,col[1]);
    g.fillStyle=bgx;g.shadowColor=col[1];g.shadowBlur=10;
    if(r>0){rr(bx,by,Math.max(10,bw*r),10,5);g.fill()}
    g.shadowBlur=0;
    g.fillStyle='#9aa4e8';g.font='11px system-ui,sans-serif';g.fillText('制限 '+limit.toFixed(2)+'s',W/2,by+28);
  }
  if(state==='ready'){
    g.fillStyle='#ffffffee';g.font='800 20px system-ui,sans-serif';
    g.fillText('ボタンを押してスタート',W/2,H*.24);
    g.font='13px system-ui,sans-serif';g.fillStyle='#a9b2f0';
    g.fillText('PC: Ctrl=方向転換+1段 / Space=1段',W/2,H*.24+26);
  }
  if(over){
    const py=H*.2;
    const pg2=g.createLinearGradient(0,py,0,py+120);pg2.addColorStop(0,'#0c0f24ee');pg2.addColorStop(1,'#1c1840ee');
    g.fillStyle=pg2;g.strokeStyle='#ff6b6b88';g.lineWidth=1.5;
    rr(W/2-130,py,260,116,18);g.fill();g.stroke();
    g.fillStyle='#ff7b7b';g.font='800 28px system-ui,sans-serif';g.fillText('失敗！',W/2,py+42);
    g.fillStyle='#fff';g.font='600 16px system-ui,sans-serif';g.fillText(reason+' ／ '+n+'段',W/2,py+70);
    g.fillStyle='#a9b2f0';g.font='12px system-ui,sans-serif';
    g.fillText(n>=best&&n>0?'🎉 ベスト更新！':'ボタンでリトライ',W/2,py+96);
  }
}
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
