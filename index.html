<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>無限階段 練習</title>
<style>
  html,body{margin:0;height:100%;background:#12141c;overflow:hidden;
    touch-action:manipulation;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .btn{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));width:42vw;max-width:260px;height:26vh;max-height:200px;
    border-radius:20px;border:2px solid #fff3;color:#fff;font-size:22px;font-weight:700;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;
    touch-action:none;opacity:.85}
  .btn small{display:block;font-size:13px;font-weight:400;opacity:.8}
  .btn.on{opacity:1;transform:scale(.96);filter:brightness(1.4)}
  #ctrl{left:max(16px,env(safe-area-inset-left));background:#7a3fd1}
  #space{right:max(16px,env(safe-area-inset-right));background:#1f8fd6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="btn" id="ctrl">Ctrl<small>方向転換して1段</small></div>
<div class="btn" id="space">Space<small>そのまま1段</small></div>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

// ズーム防止
['gesturestart','gesturechange','gestureend','contextmenu','dblclick'].forEach(e=>
  document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
let lastTouch=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<350)e.preventDefault();lastTouch=n},{passive:false});
document.addEventListener('touchmove',e=>{e.preventDefault()},{passive:false});

// ゲーム状態
const SW=34,SH=26,TW=60,TH=30,DP=34; // 1段の横移動・縦移動、ブロックの幅・奥行き・厚み
let dirs,n,face,state,timer,limit,best,reason,lockUntil,camX,camY,shake;
try{best=+localStorage.getItem('mugen_best')||0}catch(e){best=0}
function limitFor(k){return .35+2.65*Math.exp(-k/70)}
function reset(){dirs=[1];n=0;face=1;state='ready';timer=0;limit=0;reason='';camX=0;camY=0;shake=0;
  while(dirs.length<60)dirs.push(Math.random()<.5?1:-1)}
function stairX(k){let x=0;for(let i=0;i<k;i++)x+=dirs[i];return x}
function fail(r){state='over';reason=r;lockUntil=performance.now()+450;shake=1;
  if(n>best){best=n;try{localStorage.setItem('mugen_best',best)}catch(e){}}}

function act(turn){
  const now=performance.now();
  if(state==='over'){if(now>lockUntil)reset();return}
  if(turn)face=-face;
  if(dirs[n]!==face){fail('階段のない方向です');return}
  n++;state='play';
  while(dirs.length<n+60)dirs.push(Math.random()<.5?1:-1);
  limit=limitFor(n);timer=limit;
}

// 入力: ボタン
function bind(id,turn){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');act(turn)});
  const up=()=>el.classList.remove('on');
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,up));
}
bind('ctrl',true);bind('space',false);
// 入力: キーボード
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.key==='Control'||e.code==='ControlLeft'||e.code==='ControlRight'){e.preventDefault();act(true)}
  else if(e.code==='Space'){e.preventDefault();act(false)}
});

// 描画
let prev=performance.now();
function loop(t){
  const dt=Math.min((t-prev)/1000,.1);prev=t;
  if(state==='play'){timer-=dt;if(timer<=0){timer=0;fail('時間切れ')}}
  shake=Math.max(0,shake-dt*3);
  draw();requestAnimationFrame(loop);
}

function draw(){
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1b2038');bg.addColorStop(1,'#0c0e16');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  const px=stairX(n)*SW,py=-n*SH;
  camX+=(px-camX)*.25;camY+=(py-camY)*.25;
  const ox=W/2-camX+(shake?Math.sin(performance.now()/20)*shake*6:0);
  const oy=H*.5-camY;
  // 階段(奥から手前へ描画)
  const from=Math.max(0,n-8),to=n+14;
  for(let k=to;k>=from;k--){
    const x=ox+stairX(k)*SW,y=oy-k*SH,cur=k===n,past=k<n;
    const top=cur?'#ffd24a':past?'#46507a':'#7886c4';
    const lf=cur?'#c9971a':past?'#2c3454':'#566098';
    const rt=cur?'#9a7010':past?'#1f2540':'#3e4776';
    const hw=TW/2,hh=TH/2;
    g.fillStyle=lf;g.beginPath();g.moveTo(x-hw,y);g.lineTo(x,y+hh);g.lineTo(x,y+hh+DP);g.lineTo(x-hw,y+DP);g.fill();
    g.fillStyle=rt;g.beginPath();g.moveTo(x+hw,y);g.lineTo(x,y+hh);g.lineTo(x,y+hh+DP);g.lineTo(x+hw,y+DP);g.fill();
    g.fillStyle=top;g.beginPath();g.moveTo(x,y-hh);g.lineTo(x+hw,y);g.lineTo(x,y+hh);g.lineTo(x-hw,y);g.fill();
    g.strokeStyle='#fff3';g.lineWidth=1;g.stroke();
    if(k%10===0&&k>0){g.fillStyle='#fff';g.font='bold 12px sans-serif';g.textAlign='center';g.fillText(k,x,y+4)}
  }
  // プレイヤー
  const x=ox+px,y=oy+py;
  g.fillStyle='#0006';g.beginPath();g.ellipse(x,y+2,14,7,0,0,7);g.fill();
  const bodyC=state==='over'?'#e5484d':'#fff';
  g.fillStyle=bodyC;g.beginPath();g.roundRect(x-9,y-30,18,26,8);g.fill();
  g.beginPath();g.arc(x,y-32,9,0,7);g.fill();
  g.fillStyle='#12141c';g.beginPath();g.arc(x+face*4,y-33,2.5,0,7);g.fill();
  // 向きの矢印
  g.fillStyle='#ffd24a';g.font='bold 18px sans-serif';g.textAlign='center';
  g.fillText(face>0?'▶':'◀',x+face*30,y-20);

  // HUD
  g.fillStyle='#fff';g.textAlign='center';g.font='bold 44px sans-serif';
  g.fillText(n,W/2,56);
  g.font='13px sans-serif';g.fillStyle='#aab';g.fillText('BEST '+best,W/2,78);
  // タイマーバー
  const bw=Math.min(W-40,360),bx=(W-bw)/2;
  g.fillStyle='#fff2';g.fillRect(bx,92,bw,8);
  if(state==='play'){
    const r=timer/limit;
    g.fillStyle=r>.5?'#4ade80':r>.25?'#facc15':'#ef4444';
    g.fillRect(bx,92,bw*r,8);
    g.fillStyle='#aab';g.font='12px sans-serif';g.fillText('制限 '+limit.toFixed(2)+'s',W/2,118);
  }
  if(state==='ready'){
    g.fillStyle='#fffd';g.font='bold 20px sans-serif';
    g.fillText('ボタンを押してスタート',W/2,H*.25);
    g.font='14px sans-serif';g.fillStyle='#aab';
    g.fillText('PC: Ctrl=方向転換+1段 / Space=1段',W/2,H*.25+26);
  }
  if(state==='over'){
    g.fillStyle='#000a';g.fillRect(0,H*.2,W,H*.2);
    g.fillStyle='#ff6b6b';g.font='bold 28px sans-serif';g.fillText('失敗！',W/2,H*.2+44);
    g.fillStyle='#fff';g.font='16px sans-serif';g.fillText(reason+' ／ '+n+'段',W/2,H*.2+72);
    g.fillStyle='#aab';g.font='13px sans-serif';g.fillText('ボタンでリトライ',W/2,H*.2+96);
  }
}
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
