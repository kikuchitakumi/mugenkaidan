<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>無限階段 練習</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d1a;overflow:hidden;
    touch-action:manipulation;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .btn{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));width:42vw;max-width:260px;height:26vh;max-height:200px;
    border-radius:26px;color:#fff;font-size:26px;font-weight:800;letter-spacing:.04em;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.35;
    touch-action:none;border:1.5px solid #ffffff55;
    box-shadow:0 8px 28px var(--glow),inset 0 1px 0 #ffffff66,inset 0 -14px 24px #00000040;
    text-shadow:0 2px 6px #0006;transition:transform .06s,filter .06s}
  .btn small{display:block;font-size:12px;font-weight:500;opacity:.85;letter-spacing:0}
  .btn.on{transform:scale(.95);filter:brightness(1.35);box-shadow:0 2px 12px var(--glow),inset 0 1px 0 #fff8}
  #ctrl{left:max(16px,env(safe-area-inset-left));--glow:#8b4fe666;background:linear-gradient(160deg,#a56cf5,#5b2ab0)}
  #space{right:max(16px,env(safe-area-inset-right));--glow:#2aa0f066;background:linear-gradient(160deg,#4fc0ff,#1766c2)}
  #gear{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:44px;height:44px;
    border-radius:50%;border:1.5px solid #ffffff44;background:#ffffff18;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none}
  #rank{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));width:44px;height:44px;
    border-radius:50%;border:1.5px solid #ffffff44;background:#ffffff18;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none}
  #panel,#setpanel{position:fixed;inset:0;z-index:20;background:#05060ccc;display:none;align-items:center;justify-content:center;touch-action:auto}
  #panel .card,#setpanel .card{width:min(88vw,340px);background:linear-gradient(#1c1f45,#10122a);border:1.5px solid #ffffff33;border-radius:20px;padding:18px;color:#fff;box-shadow:0 10px 40px #0008}
  #panel h2,#setpanel h2{margin:0 0 10px;font-size:20px;text-align:center}
  #list{list-style:none;margin:0 0 12px;padding:0;min-height:60px;font-size:15px}
  #list li{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px}
  #list li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #list li:nth-child(odd){background:#ffffff0d}
  #list li.me{background:#ffd24a33;color:#ffe38a}
  #panel .row{display:flex;gap:8px}
  #name{flex:1;min-width:0;font-size:16px;padding:10px;border-radius:10px;border:1px solid #ffffff44;background:#0006;color:#fff;-webkit-user-select:text;user-select:text}
  #panel button,#setpanel button{font-size:15px;font-weight:700;padding:10px 14px;border-radius:10px;border:0;color:#fff;background:linear-gradient(160deg,#4fc0ff,#1766c2)}
  #panel #close,#setpanel #s-close{display:block;width:100%;margin-top:12px;background:#ffffff22}
  #stat{margin:10px 0 0;font-size:12px;color:#a9b2f0;text-align:center;min-height:16px}
  .set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px;font-size:15px}
  .set input[type=range]{flex:1;max-width:150px;accent-color:#4fc0ff}
  .set input[type=checkbox]{width:22px;height:22px;accent-color:#4fc0ff}
  #setpanel .card{max-height:88vh;overflow:auto}
  #chars{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  #chars .ch{width:52px;height:60px;border-radius:12px;border:2px solid #ffffff44;padding:0;background:#ffffff14;font-size:22px;color:#fff}
  #chars .ch.sel{border-color:#fff;box-shadow:0 0 0 2px #4fc0ff}
  #skins{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  #skins .sk{width:44px;height:44px;border-radius:12px;border:2px solid #ffffff44;padding:0;font-size:16px;color:#fff}
  #skins .sk.sel{border-color:#fff;box-shadow:0 0 0 2px #4fc0ff}
  #skins .sk.lock{opacity:.5}
  .tests{display:flex;gap:6px;margin-top:6px}
  #setpanel .tests button{flex:1;padding:9px 4px;font-size:13px}
  #setpanel .note{margin:8px 0 0;font-size:12px;color:#a9b2f0;line-height:1.5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="gear">⚙</div>
<div id="rank">🏆</div>
<div id="setpanel"><div class="card">
  <h2>⚙ 設定</h2>
  <label class="set"><span>BGM</span><input type="checkbox" id="s-bgm"></label>
  <label class="set"><span>BGM音量</span><input type="range" id="s-bgmv" min="0" max="100"></label>
  <label class="set"><span>効果音</span><input type="checkbox" id="s-se"></label>
  <label class="set"><span>効果音音量</span><input type="range" id="s-sev" min="0" max="100"></label>
  <div class="set" style="padding-bottom:0"><span>キャラクター</span></div>
  <div id="chars"></div>
  <input type="file" id="s-file" accept="image/*" hidden>
  <p class="note" id="char-note"></p>
  <div class="set" style="padding-bottom:0"><span>階段のスキン</span></div>
  <div id="skins"></div>
  <p class="note" id="skin-note"></p>
  <div class="set" style="padding-bottom:0"><span>BGM試聴</span></div>
  <div class="tests"><button data-t="0">1〜199</button><button data-t="1">200〜399</button><button data-t="2">400〜</button><button data-t="-1">停止</button></div>
  <p class="note">階数でBGMが切り替わります<br>1〜199段 / 200〜399段 / 400段〜</p>
  <button id="s-close">閉じる</button>
</div></div>
<div id="panel"><div class="card">
  <h2>🏆 ランキング</h2>
  <ul id="list"></ul>
  <div class="row"><input id="name" maxlength="12" placeholder="ニックネーム" autocomplete="off"><button id="save">保存</button></div>
  <p id="stat"></p>
  <button id="close">閉じる</button>
</div></div>
<div class="btn" id="ctrl">Ctrl<small>方向転換して1段</small></div>
<div class="btn" id="space">Space<small>そのまま1段</small></div>
<script>
(()=>{
const cv=document.getElementById('c');let g=cv.getContext('2d');
let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

// ズーム防止
['gesturestart','gesturechange','gestureend','contextmenu','dblclick'].forEach(e=>
  document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
let lastTouch=0;
document.addEventListener('touchend',e=>{if(e.target.closest&&e.target.closest('#panel,#setpanel'))return;const n=Date.now();if(n-lastTouch<350)e.preventDefault();lastTouch=n},{passive:false});
document.addEventListener('touchmove',e=>{if(e.target.closest&&e.target.closest('#panel,#setpanel'))return;e.preventDefault()},{passive:false});

// ---------- 設定 ----------
const S={bgmOn:true,bgmVol:.5,seOn:true,seVol:1,skin:'auto',char:'catw'};
try{Object.assign(S,JSON.parse(localStorage.getItem('mugen_set')||'{}'))}catch(e){}
const saveS=()=>{try{localStorage.setItem('mugen_set',JSON.stringify(S))}catch(e){}};

// ---------- 効果音(WebAudioで合成。Ctrl用とSpace用の2種類だけ) ----------
let ac=null;
function audioInit(){
  if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A()}
  if(ac&&ac.state==='suspended')ac.resume();
  bgmSetup();
}
function tone(f,d,type,vol,f2){
  if(!S.seOn||!ac)return;
  const t=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol*S.seVol,t+.008);
  gn.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(gn).connect(ac.destination);o.start(t);o.stop(t+d+.02);
}
const sfxSpace=()=>tone(300,.12,'square',.09,520);        // Space: 低め→上がる「ブッ」
const sfxCtrl=()=>tone(780,.09,'triangle',.2);           // Ctrl: 高めの「ポッ」

// ---------- BGM(階数で切り替え) ----------
const BGM=['1-199.mp3','200-399.mp3','400-inf.mp3'];
const BGM_VOL=[1,.45,.45]; // 曲ごとの基準音量(設定の音量に掛け算)。200-399と400-infは45%
const bgmEls=[],bgmGains=[],bgmPre=[];
let bgmCur=-1;
const tierOf=k=>k<=199?0:k<=399?1:2;
function bgmSetup(){
  if(bgmEls.length||!ac)return;
  BGM.forEach(src=>{
    const a=new Audio();a.src=src;a.loop=true;a.preload='none';
    const gn=ac.createGain();gn.gain.value=0;
    ac.createMediaElementSource(a).connect(gn).connect(ac.destination);
    bgmEls.push(a);bgmGains.push(gn);
  });
}
// i番目を鳴らす(-1で停止)。dur秒かけてクロスフェード
function bgmTo(i,dur=1){
  if(!ac||!bgmEls.length)return;
  bgmCur=i;
  const now=ac.currentTime;
  bgmEls.forEach((a,j)=>{
    const gn=bgmGains[j],on=j===i&&S.bgmOn;
    gn.gain.cancelScheduledValues(now);gn.gain.setValueAtTime(gn.gain.value,now);
    gn.gain.linearRampToValueAtTime(on?S.bgmVol*BGM_VOL[j]:0,now+dur);
    if(on){if(a.paused)a.play().catch(()=>{})}
    else if(!a.paused){
      setTimeout(()=>{if(!(bgmCur===j&&S.bgmOn)){a.pause();if(bgmCur<0)a.currentTime=0}},dur*1000+100);
    }
  });
}
function bgmSync(){
  const t=tierOf(n);
  if(bgmCur!==t)bgmTo(t,bgmCur<0?0:1); // 曲が鳴っていない状態からの開始はフェードなしで即再生
  // 次の曲を少し前から先読み
  [[185,1],[385,2]].forEach(([at,i])=>{
    if(n>=at&&!bgmPre[i]&&bgmEls[i]){bgmPre[i]=1;bgmEls[i].preload='auto';bgmEls[i].load()}
  });
}
document.addEventListener('visibilitychange',()=>{if(ac)document.hidden?ac.suspend():ac.resume()});

// ---------- 設定画面 ----------
const gearEl=document.getElementById('gear'),setpanel=document.getElementById('setpanel'),
  eBgm=document.getElementById('s-bgm'),eBgmV=document.getElementById('s-bgmv'),
  eSe=document.getElementById('s-se'),eSeV=document.getElementById('s-sev');
gearEl.addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();audioInit();
  eBgm.checked=S.bgmOn;eBgmV.value=Math.round(S.bgmVol*100);
  eSe.checked=S.seOn;eSeV.value=Math.round(S.seVol*100);buildSkins();buildChars();
  panelOpen=true;setpanel.style.display='flex';
});
document.getElementById('s-close').addEventListener('click',()=>{
  panelOpen=false;setpanel.style.display='none';
  bgmTo(state==='play'?tierOf(n):-1,.4); // 試聴を止め、プレイ中なら本来の曲に戻す
});
document.querySelectorAll('#setpanel .tests button').forEach(b=>b.addEventListener('click',()=>{
  audioInit();const i=+b.dataset.t;
  if(i>=0&&!S.bgmOn){S.bgmOn=true;eBgm.checked=true;saveS()}
  bgmTo(i,.4);
}));
eBgm.addEventListener('change',()=>{S.bgmOn=eBgm.checked;saveS();audioInit();if(bgmCur>=0)bgmTo(bgmCur,.3)});
eBgmV.addEventListener('input',()=>{S.bgmVol=eBgmV.value/100;saveS();if(bgmCur>=0)bgmTo(bgmCur,.1)});
eSe.addEventListener('change',()=>{S.seOn=eSe.checked;saveS();audioInit();sfxSpace()});
eSeV.addEventListener('input',()=>{S.seVol=eSeV.value/100;saveS()});
eSeV.addEventListener('change',()=>{audioInit();sfxSpace()});

// ---------- ゲーム状態 ----------
const SW=56,SH=38,SR=3; // 階段同士の間隔(横・縦)・角丸
const STW=66,STH=7;       // 階段(光の棒)の長さと太さ
let dirs,n,face,state,timer,limit,best,reason,lockUntil,camX,camY,shake;
let recT=0,recShown=false,runBest=0; // NEW RECORD演出の残り時間/今回表示済みか/開始時の自己ベスト
let vx,vy,hop,fx,fy,fv,parts;
try{best=+localStorage.getItem('mugen_best')||0}catch(e){best=0}
const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.4,z:Math.random()*.25+.05}));
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const PAL=[ // 上/中/下/光/星の明るさ/雲の濃さ
  {c:['#4aa8ee','#86cffa','#d8f2ff'],gl:'#ffffff',star:0,cloud:1,s:['#7f5cf0','#3a1fa8']},   // 0〜99  空
  {c:['#2f2f86','#e0587a','#ffb764'],gl:'#ffd28a',star:.15,cloud:0,s:['#c3cbff','#6e7be0']}, // 100〜 夕焼け
  {c:['#070c26','#14214c','#2c3f7c'],gl:'#5a7bd4',star:.8,cloud:0,s:['#a9b6ff','#5f6ed6']},  // 200〜 夜
  {c:['#04020c','#12082c','#2c1552'],gl:'#7a4bd4',star:1,cloud:0,s:['#a9b6ff','#5f6ed6']}    // 300〜 宇宙
].map(p=>({...p,rgb:p.c.map(hex),g:hex(p.gl),sc:p.s.map(hex)}));
const SKINS=[
  {id:'auto',name:'自動(背景に合わせる)',sw:'linear-gradient(135deg,#7f5cf0,#a9b6ff)'},
  {id:'pink',name:'ピンク',c:['#ffd0e8','#e0559f'],line:'#4a0f33aa'},
  {id:'mint',name:'ミント',c:['#c8ffe2','#2fbf86'],line:'#073a2aaa'},
  {id:'white',name:'ホワイト',c:['#ffffff','#b8c2dd'],line:'#2a3560aa'},
  {id:'dark',name:'ダーク',c:['#5a6088','#1c2038'],line:'#b8c6ffcc'},
  {id:'blue',name:'蒼光',c:['#d8f4ff','#2b86ff'],line:'#e6f8ffcc',lock:400}
].map(k=>({...k,rgb:k.c&&k.c.map(hex),sw:k.sw||'linear-gradient(135deg,'+(k.c&&k.c[0])+','+(k.c&&k.c[1])+')'}));
const skinOk=k=>!k.lock||best>=k.lock;
const curSkin=()=>SKINS.find(k=>k.id===S.skin&&skinOk(k))||SKINS[0];
function buildSkins(){
  const box=document.getElementById('skins'),note=document.getElementById('skin-note');
  box.textContent='';
  SKINS.forEach(k=>{
    const ok=skinOk(k),b=document.createElement('button');
    b.className='sk'+(curSkin()===k?' sel':'')+(ok?'':' lock');
    b.style.background=k.sw;b.title=k.name;b.textContent=ok?'':'🔒';
    b.addEventListener('click',()=>{
      if(!ok){note.textContent='🔒 '+k.name+'は'+k.lock+'段に到達すると解放されます';return}
      S.skin=k.id;saveS();buildSkins();
    });
    box.append(b);
  });
  note.textContent='選択中: '+curSkin().name+(best<400?' ／ 🔒蒼光は400段到達で解放':'');
}
let bgN=0;
const mixc=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const css=(c,a)=>a==null?'rgb('+c+')':'rgba('+c+','+a+')';
function limitFor(k){return .35+2.65*Math.exp(-k/250)}
function reset(){recT=0;recShown=false;runBest=best;dirs=[1];n=0;face=1;state='ready';timer=0;limit=0;reason='';rankNote='';bgN=0;camX=0;camY=0;shake=0;
  vx=0;vy=0;hop=0;fx=0;fy=0;fv=0;parts=[];
  while(dirs.length<60)dirs.push(Math.random()<.5?1:-1)}
function stairX(k){let x=0;for(let i=0;i<k;i++)x+=dirs[i];return x}
function burst(x,y,col,cnt,sp){
  for(let i=0;i<cnt;i++){const a=Math.random()*6.283,s=Math.random()*sp;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*.4,life:1,col})}}
function fail(r){state='over';reason=r;lockUntil=performance.now()+450;shake=1;fv=-120;bgmTo(-1,.8);
  burst(vx,vy,'#ff6b6b',26,200);
  if(n>best){best=n;try{localStorage.setItem('mugen_best',best)}catch(e){}}
  onGameOver()}

// ---------- ランキング(Firebase Firestore) ----------
// Firebaseの設定を貼ると有効になります(nullの間はランキング機能は非表示)
const FIREBASE_CONFIG={
  apiKey:"AIzaSyCb6ZRfEVP7b7_812vBzGlHPXO3UI2hoS4",
  authDomain:"mugenkaidan.firebaseapp.com",
  projectId:"mugenkaidan",
  storageBucket:"mugenkaidan.firebasestorage.app",
  messagingSenderId:"295795145152",
  appId:"1:295795145152:web:a6605b69d155e18cf43025"
};
const panel=document.getElementById('panel'),rankBtn=document.getElementById('rank'),
  listEl=document.getElementById('list'),nameEl=document.getElementById('name'),
  statEl=document.getElementById('stat');
let panelOpen=false,fb=null,myName='',asked=false,pending=0,rankNote='',rankAt=0;
try{myName=localStorage.getItem('mugen_name')||''}catch(e){}
nameEl.value=myName;
if(!FIREBASE_CONFIG)rankBtn.style.display='none';
const FB='https://www.gstatic.com/firebasejs/10.12.2/';
async function fbInit(){
  if(!FIREBASE_CONFIG)return null;
  if(fb)return fb;
  try{
    const [A,Au,F]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
    const app=A.initializeApp(FIREBASE_CONFIG),auth=Au.getAuth(app);
    await Au.signInAnonymously(auth);
    fb={F,db:F.getFirestore(app),uid:auth.currentUser.uid};
  }catch(e){console.warn(e);statEl.textContent='ランキングに接続できません'}
  return fb;
}
async function loadRank(){
  listEl.textContent='読み込み中…';
  if(!await fbInit()){listEl.textContent='';return}
  try{
    const {F,db}=fb;
    const snap=await F.getDocs(F.query(F.collection(db,'scores'),F.orderBy('score','desc'),F.limit(10)));
    listEl.textContent='';let i=0;
    snap.forEach(d=>{i++;const v=d.data(),li=document.createElement('li');
      if(v.u===fb.uid)li.className='me';
      const a=document.createElement('span'),b=document.createElement('b');
      a.textContent=i+'. '+v.name;b.textContent=v.score+'段';li.append(a,b);listEl.append(li)});
    if(!i)listEl.textContent='まだ記録がありません';
  }catch(e){console.warn(e);listEl.textContent='';statEl.textContent='ランキングを取得できません'}
}
// ランキングは10枠(ドキュメントID 0〜9)だけ。圏内なら一番低い枠を上書きする。
// 同じ人が複数枠に入ってもよい。11位以下は保存されない。
async function submitScore(sc){
  if(!FIREBASE_CONFIG||!myName||sc<1)return;
  if(!await fbInit())return;
  const {F,db,uid}=fb;
  for(let t=0;t<3;t++){
    try{
      const snap=await F.getDocs(F.collection(db,'scores'));
      const rows=[];snap.forEach(d=>rows.push({id:d.id,score:d.data().score}));
      let slot;
      if(rows.length<10){
        const used=new Set(rows.map(r=>r.id));
        for(let i=0;i<10;i++)if(!used.has(String(i))){slot=String(i);break}
      }else{
        rows.sort((a,b)=>a.score-b.score);
        if(sc<=rows[0].score){statEl.textContent='ランキング圏外です(10位は'+rows[0].score+'段)';return}
        slot=rows[0].id;
      }
      await F.setDoc(F.doc(db,'scores',slot),{name:myName,score:sc,u:uid,t:F.serverTimestamp()});
      rankNote='🏆 ランキング入り！';rankAt=performance.now();statEl.textContent='ランキングに登録しました！';return;
    }catch(e){console.warn(e)}
  }
  statEl.textContent='登録に失敗しました';
}
function openPanel(ask){
  panelOpen=true;panel.style.display='flex';
  statEl.textContent=ask?'名前を入れるとランキングに参加できます':'';
  loadRank();
}
function onGameOver(){
  if(!FIREBASE_CONFIG||n<1)return;
  if(!myName){
    pending=n;
    if(!asked){asked=true;setTimeout(()=>{if(state==='over')openPanel(true)},900)}
    return;
  }
  submitScore(n);
}
rankBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audioInit();openPanel(false)});
document.getElementById('close').addEventListener('click',()=>{panelOpen=false;panel.style.display='none'});
document.getElementById('save').addEventListener('click',async()=>{
  const v=nameEl.value.trim().slice(0,12);
  if(!v){statEl.textContent='名前を入力してください';return}
  myName=v;try{localStorage.setItem('mugen_name',v)}catch(e){}
  if(pending>0){const sc=pending;pending=0;statEl.textContent='登録中…';await submitScore(sc)}
  else statEl.textContent='名前を保存しました';
  await loadRank();
});

function act(turn){
  if(panelOpen)return;
  audioInit();
  turn?sfxCtrl():sfxSpace();
  const now=performance.now();
  if(state==='over'){if(now>lockUntil)reset();return}
  if(turn)face=-face;
  if(dirs[n]!==face){fail('階段のない方向です');return}
  n++;state='play';hop=1;bgmSync();
  if(!recShown&&runBest>0&&n>runBest){ // 自己ベストを超えた瞬間
    recShown=true;recT=2.6;burst(stairX(n)*SW,-n*SH,'#ffd24a',36,230);
  }
  burst(stairX(n)*SW,-n*SH,turn?'#b98cff':'#7fd0ff',n%100===0?30:9,n%100===0?200:90);
  while(dirs.length<n+60)dirs.push(Math.random()<.5?1:-1);
  limit=limitFor(n);timer=limit;
}

// 入力: ボタン
function bind(id,turn){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');act(turn)});
  const up=()=>el.classList.remove('on');
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,up));
}
bind('ctrl',true);bind('space',false);
// 入力: キーボード
addEventListener('keydown',e=>{
  if(e.repeat||(e.target&&e.target.tagName==='INPUT'))return;
  if(e.key==='Control'||e.code==='ControlLeft'||e.code==='ControlRight'){e.preventDefault();act(true)}
  else if(e.code==='Space'){e.preventDefault();act(false)}
});

let prev=performance.now();
function loop(t){
  const dt=Math.min((t-prev)/1000,.1);prev=t;
  if(state==='play'){timer-=dt;if(timer<=0){timer=0;fail('時間切れ')}}
  shake=Math.max(0,shake-dt*3);
  hop=Math.max(0,hop-dt*6);recT=Math.max(0,recT-dt);
  const tx=stairX(n)*SW,ty=-n*SH;
  vx+=(tx-vx)*Math.min(1,dt*22);vy+=(ty-vy)*Math.min(1,dt*22);
  if(state==='over'){fv+=dt*900;fy+=fv*dt;fx+=face*dt*40}
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=dt*320;p.life-=dt*2.2}
  const lx=Math.min(1,Math.max(0,(bgN-390)/20));
  if(lx>.3&&Math.random()<lx*dt*30){ // 400段〜: 階段から光の粒が立ちのぼる
    const k=n-2+Math.floor(Math.random()*10);
    parts.push({x:stairX(k)*SW+(Math.random()-.5)*STW,y:-k*SH+Math.random()*STH,vx:(Math.random()-.5)*20,vy:-40-Math.random()*40,life:1,col:Math.random()<.5?'#bfe9ff':'#ffffff'});
  }
  parts=parts.filter(p=>p.life>0);
  draw();requestAnimationFrame(loop);
}

function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}

function tri(x1,y1,x2,y2,x3,y3){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.lineTo(x3,y3);g.closePath();g.fill()}
function drawAnimal(f,over,o){
  g.lineCap='round';g.lineJoin='round';
  const ink=o.dark?'#ffffff':'#2a3050';
  g.shadowColor='#2a305066';g.shadowBlur=4;
  // しっぽ
  if(o.tail==='cat'){
    g.beginPath();g.moveTo(-f*9,-6);g.quadraticCurveTo(-f*22,-6,-f*19,-22);
    g.strokeStyle=o.line;g.lineWidth=7;g.stroke();
    g.strokeStyle=o.body[0];g.lineWidth=5;g.stroke();
  }else if(o.tail==='pom'){
    g.fillStyle=o.body[0];g.beginPath();g.arc(-f*13,-7,5,0,7);g.fill();g.strokeStyle=o.line;g.lineWidth=1;g.stroke();
  }
  // 体
  let gr=g.createLinearGradient(0,-18,0,0);gr.addColorStop(0,o.body[0]);gr.addColorStop(1,o.body[1]);
  g.fillStyle=gr;g.beginPath();g.ellipse(0,-8,12,9,0,0,7);g.fill();g.strokeStyle=o.line;g.lineWidth=1;g.stroke();
  g.fillStyle=o.belly;g.beginPath();g.ellipse(0,-5,6,5,0,0,7);g.fill();
  g.beginPath();g.ellipse(-6,-1,4.5,3,0,0,7);g.fill();g.beginPath();g.ellipse(6,-1,4.5,3,0,0,7);g.fill();
  // 耳
  if(o.ear==='cat'){
    g.fillStyle=o.body[0];tri(-13,-22,-11,-36,-3,-29);tri(13,-22,11,-36,3,-29);
    g.fillStyle=o.inner;tri(-11,-24,-10.3,-32,-5,-28);tri(11,-24,10.3,-32,5,-28);
  }else if(o.ear==='rabbit'){
    [-1,1].forEach(sd=>{
      g.fillStyle=o.body[0];g.beginPath();g.ellipse(sd*6,-40,4.3,10.5,sd*.12,0,7);g.fill();g.strokeStyle=o.line;g.lineWidth=1;g.stroke();
      g.fillStyle=o.inner;g.beginPath();g.ellipse(sd*6,-39,2,7.5,sd*.12,0,7);g.fill();
    });
  }
  // 頭
  gr=g.createLinearGradient(0,-31,0,-9);gr.addColorStop(0,o.body[0]);gr.addColorStop(1,o.body[1]);
  g.fillStyle=gr;g.beginPath();g.ellipse(0,-20,14,11.5,0,0,7);g.fill();g.strokeStyle=o.line;g.lineWidth=1;g.stroke();
  g.shadowBlur=0;
  if(o.stripe){ // おでこの縞
    g.strokeStyle=o.stripe;g.lineWidth=1.8;
    g.beginPath();g.moveTo(0,-31);g.lineTo(0,-27);g.moveTo(-4,-30.5);g.lineTo(-3.4,-27.5);g.moveTo(4,-30.5);g.lineTo(3.4,-27.5);g.stroke();
  }
  if(o.tuft){ // ひよこの毛
    g.strokeStyle=o.line;g.lineWidth=2;
    g.beginPath();g.moveTo(-2,-31);g.lineTo(-4,-36);g.moveTo(0,-31.5);g.lineTo(0,-37);g.moveTo(2,-31);g.lineTo(4,-36);g.stroke();
  }
  // ほっぺ
  g.fillStyle='#ff7f8a66';g.beginPath();g.arc(-9+f*2,-15.5,3,0,7);g.fill();g.beginPath();g.arc(9+f*2,-15.5,3,0,7);g.fill();
  // 目(進行方向を見る)
  const ex=f*2.5;
  if(over){
    g.strokeStyle=ink;g.lineWidth=1.8;
    [-5.5,5.5].forEach(x=>{g.beginPath();g.moveTo(x+ex-2,-23);g.lineTo(x+ex+2,-19);g.moveTo(x+ex+2,-23);g.lineTo(x+ex-2,-19);g.stroke()});
  }else if(o.eye){
    [-5.5,5.5].forEach(x=>{g.fillStyle=o.eye;g.beginPath();g.ellipse(x+ex,-21,3.2,3.8,0,0,7);g.fill();
      g.fillStyle='#1a1d30';g.beginPath();g.ellipse(x+ex,-21,1.3,3,0,0,7);g.fill()});
  }else{
    g.fillStyle='#2a3050';
    [-5.5,5.5].forEach(x=>{g.beginPath();g.ellipse(x+ex,-21,2.6,3.2,0,0,7);g.fill()});
    g.fillStyle='#fff';
    [-5.5,5.5].forEach(x=>{g.beginPath();g.arc(x+ex+.9,-22.2,1,0,7);g.fill()});
  }
  // 鼻・口 / くちばし
  if(o.beak){
    g.fillStyle=o.beak;tri(ex-3.2,-17.5,ex+3.2,-17.5,ex,-13);
  }else{
    g.fillStyle='#ff6f8a';tri(ex-1.8,-17,ex+1.8,-17,ex,-15);
    g.strokeStyle=o.mouth||'#2a3050';g.lineWidth=1.1;
    g.beginPath();g.arc(ex-1.6,-14.4,1.7,0,Math.PI);g.arc(ex+1.6,-14.4,1.7,0,Math.PI);g.stroke();
  }
  // ひげ
  if(o.ear==='cat'||o.ear==='rabbit'){
    g.strokeStyle=o.whisk||'#8f99bddd';g.lineWidth=1;
    [[-1,-1.5],[-1,1.5]].forEach(([d,dy])=>{g.beginPath();g.moveTo(-10+ex,-16+dy*.4);g.lineTo(-18+ex,-16+dy*2.2);g.stroke();
      g.beginPath();g.moveTo(10+ex,-16+dy*.4);g.lineTo(18+ex,-16+dy*2.2);g.stroke()});
  }
}

document.getElementById('s-file').addEventListener('change',e=>{

});

function draw(){
  // 背景: 100段ごとに 空→夕焼け→夜→宇宙。各100段の終盤20段でなめらかに次へ
  bgN+=(n-bgN)*.08;
  const lux=Math.min(1,Math.max(0,(bgN-390)/20)); // 400段で豪華(蒼光)モードへ
  const pi=Math.min(3,Math.floor(bgN/100)),pj=Math.min(3,pi+1);
  const bt=pi>=3?0:Math.min(1,Math.max(0,((bgN%100)-80)/20));
  const A=PAL[pi],B=PAL[pj];
  const c0=mixc(A.rgb[0],B.rgb[0],bt),c1=mixc(A.rgb[1],B.rgb[1],bt),c2=mixc(A.rgb[2],B.rgb[2],bt);
  const gcol=mixc(mixc(A.g,B.g,bt),[58,160,255],lux),starA=A.star+(B.star-A.star)*bt,cloudA=A.cloud+(B.cloud-A.cloud)*bt;
  // 階段の色: スキン(自動なら背景連動) → 400段到達で蒼光に
  const sk=curSkin();
  const b1=sk.rgb?sk.rgb[0]:mixc(A.sc[0],B.sc[0],bt),b2=sk.rgb?sk.rgb[1]:mixc(A.sc[1],B.sc[1],bt);
  const st1=css(mixc(b1,[226,246,255],lux)),st2=css(mixc(b2,[30,120,255],lux));
  const glow=Math.max(lux,sk.id==='blue'?.7:0);
  const lineC=(lux>.5||sk.id==='blue')?'#e6f8ffcc':(sk.line||'#0b0f3a88');
  const curC1=css(mixc([255,242,168],[255,255,255],lux)),curC2=css(mixc([255,181,46],[110,205,255],lux));
  const bg=g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,css(c0));bg.addColorStop(.55,css(c1));bg.addColorStop(1,css(c2));
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  const gl=g.createRadialGradient(W/2,H*.45,0,W/2,H*.45,H*.6);
  gl.addColorStop(0,css(gcol,.28+.22*lux));gl.addColorStop(1,css(gcol,0));
  g.fillStyle=gl;g.fillRect(0,0,W,H);
  camX+=(vx-camX)*.18;camY+=(vy-camY)*.18;
  const tw=performance.now()/1000;
  if(starA>.01){
    for(const s of stars){
      const sy=((s.y*H-camY*s.z)%H+H)%H,sx=((s.x*W-camX*s.z*.5)%W+W)%W;
      g.globalAlpha=starA*(.35+.35*Math.sin(tw*2+s.x*20));
      g.fillStyle='#fff';g.beginPath();g.arc(sx,sy,s.r,0,7);g.fill();
    }
  }
  if(cloudA>.01){
    g.fillStyle='#fff';
    for(let i=0;i<6;i++){
      const cx=(((i*.37+.1)*W*1.6-camX*.15*(.6+i*.12))%(W+240)+W+240)%(W+240)-120;
      const cy=(((i*.21+.08)*H-camY*.1*(1+i*.2))%H+H)%H,r=26+i*5;
      g.globalAlpha=.5*cloudA;
      g.beginPath();g.ellipse(cx,cy,r*1.8,r*.7,0,0,7);g.ellipse(cx-r*.8,cy+r*.15,r*1.1,r*.55,0,0,7);g.ellipse(cx+r*.9,cy+r*.1,r*1.2,r*.6,0,0,7);g.fill();
    }
  }
  g.globalAlpha=1;

  const ox=W/2-camX+(shake?Math.sin(performance.now()/20)*shake*6:0);
  const oy=H*.5-camY;

  // 100段ごとの区切り線と大きな数字(階段より奥に描く)
  for(let k=Math.max(1,n-12);k<=n+16;k++){
    if(k%100)continue;
    const ly=oy-k*SH+STH/2,col=lux>.5?'159,220,255':'255,210,74';
    const lg=g.createLinearGradient(0,0,W,0);
    lg.addColorStop(0,'rgba('+col+',0)');lg.addColorStop(.12,'rgba('+col+',.9)');lg.addColorStop(.88,'rgba('+col+',.9)');lg.addColorStop(1,'rgba('+col+',0)');
    g.globalAlpha=k>n+9?Math.max(0,1-(k-n-9)/7):1;
    g.fillStyle=lg;g.fillRect(0,ly-1,W,2.5);
    g.textAlign='left';g.font='800 40px system-ui,sans-serif';
    g.shadowColor='rgb('+col+')';g.shadowBlur=14;g.fillStyle='rgb('+col+')';
    g.fillText(k,14,ly-8);g.shadowBlur=0;g.globalAlpha=1;
  }

  // 自己ベストの高さに点線と文字(今回のスタート時点のベスト)
  if(runBest>0&&runBest>=n-12&&runBest<=n+16){
    const ly=oy-runBest*SH+STH/2;
    g.globalAlpha=runBest>n+9?Math.max(0,1-(runBest-n-9)/7):1;
    g.setLineDash([10,7]);g.strokeStyle='#ff5c8a';g.lineWidth=2.5;
    g.beginPath();g.moveTo(0,ly);g.lineTo(W,ly);g.stroke();g.setLineDash([]);
    g.textAlign='right';g.font='800 20px system-ui,sans-serif';
    g.shadowColor='#e0306a';g.shadowBlur=8;g.fillStyle='#ffffff';
    g.fillText('🏆 BEST '+runBest,W-14,ly-8);g.shadowBlur=0;g.globalAlpha=1;
  }

  // 階段(平面・角丸グラデーション)
  const from=Math.max(0,n-8),to=n+14;
  for(let k=to;k>=from;k--){
    const x=ox+stairX(k)*SW-STW/2,y=oy-k*SH,w=STW,h=STH;
    const cur=k===n,past=k<n;
    g.globalAlpha=(past?.6:1)*(k>n+9?Math.max(0,1-(k-n-9)/6):1);
    let c1,c2;
    if(cur){c1=curC1;c2=curC2}
    else{c1=st1;c2=st2}
    const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,c1);gr.addColorStop(1,c2);
    g.fillStyle=gr;
    // 棒の光(近くの段だけ光らせて軽く)
    if(cur){g.shadowColor=lux>.5?'#58b8ff':'#ffd24a';g.shadowBlur=20+12*lux}
    else if(k>=n-3&&k<=n+9){g.shadowColor=glow>.01?'#3aa0ff':c1;g.shadowBlur=glow>.01?14*glow:5}
    rr(x,y,w,h,SR);g.fill();
    g.shadowBlur=0;
    g.strokeStyle=lineC;g.lineWidth=1.2;g.stroke(); // 縁取りで輪郭をはっきり
    g.fillStyle=glow>.3?'#ffffffee':'#ffffffcc';rr(x+3,y+1,w-6,2,1);g.fill(); // 上辺のハイライト
    if(glow>.3){ // 光が走る
      g.save();rr(x,y-2,w,h+4,SR);g.clip();g.globalAlpha*=glow*.8;
      const sx=((tw*70+k*41)%(w+50))-25;
      g.fillStyle='#ffffff88';g.beginPath();g.moveTo(x+sx,y-2);g.lineTo(x+sx+14,y-2);g.lineTo(x+sx+4,y+h+2);g.lineTo(x+sx-10,y+h+2);g.fill();
      g.restore();
    }
    g.globalAlpha=1;
  }

  // プレイヤー
  const over=state==='over';
  const jump=Math.sin(Math.PI*(1-hop))*(hop>0?14:0);
  const x=ox+vx+fx,y=oy+vy+fy-jump-3;
  if(!over){g.fillStyle='#00000066';g.beginPath();g.ellipse(ox+vx,oy+vy+STH-2,14-jump*.3,4,0,0,7);g.fill()}
  const sq=hop>0?1+.12*Math.sin(Math.PI*hop):1;
  g.save();g.translate(x,y);g.scale(1/sq,sq);
  drawPlayer(face,over);
  g.restore();
  // 向きの矢印
  if(!over){
    g.fillStyle='#ffd24a';g.font='bold 18px sans-serif';g.textAlign='center';
    g.shadowColor='#ffb52e';g.shadowBlur=10;
    g.fillText(face>0?'▶':'◀',ox+vx+face*42,oy+vy-6);g.shadowBlur=0;
  }
  // パーティクル
  for(const p of parts){
    g.globalAlpha=Math.max(0,p.life);g.fillStyle=p.col;
    g.beginPath();g.arc(ox+p.x,oy+p.y-10,2.4*p.life+.6,0,7);g.fill();
  }
  g.globalAlpha=1;

  // HUD
  g.textAlign='center';
  g.shadowColor='#7f8cff';g.shadowBlur=18;
  g.fillStyle='#fff';g.font='800 52px system-ui,sans-serif';
  g.fillText(n,W/2,62);g.shadowBlur=0;
  // 自己ベスト(プレイ中に超えたら、その場で更新表示+金色)
  const live=Math.max(best,n),rec=n>runBest&&n>0&&runBest>0;
  const btxt='🏆 BEST '+live,bpw=104;
  if(rec){const pgd=g.createLinearGradient(W/2-bpw/2,0,W/2+bpw/2,0);pgd.addColorStop(0,'#ffe27a');pgd.addColorStop(1,'#ffb52e');g.fillStyle=pgd}
  else g.fillStyle='#00000040';
  rr(W/2-bpw/2,68,bpw,20,10);g.fill();
  g.fillStyle=rec?'#5a3a00':'#ffffffee';g.font='700 12px system-ui,sans-serif';
  g.fillText(btxt,W/2,82.5);
  const bw=Math.min(W-48,340),bx=(W-bw)/2,by=98;
  g.fillStyle='#00000033';rr(bx,by,bw,10,5);g.fill();
  if(state==='play'){
    const r=Math.max(0,timer/limit);
    const col=r>.5?['#7bf0a8','#2ec27a']:r>.25?['#ffe27a','#f0b020']:['#ff8a8a','#e03a3a'];
    const bgx=g.createLinearGradient(bx,0,bx+bw,0);bgx.addColorStop(0,col[0]);bgx.addColorStop(1,col[1]);
    g.fillStyle=bgx;g.shadowColor=col[1];g.shadowBlur=10;
    if(r>0){rr(bx,by,Math.max(10,bw*r),10,5);g.fill()}
    g.shadowBlur=0;
    g.fillStyle='#ffffffdd';g.font='11px system-ui,sans-serif';g.fillText('制限 '+limit.toFixed(2)+'s',W/2,by+28);
  }
  if(recT>0){ // NEW RECORD: 画面上部の小さなバナー(操作の邪魔にならない位置)
    const age=2.6-recT,pop=age<.3?.6+.4*Math.sin(age/.3*Math.PI/2):1,fade=recT<.6?recT/.6:1;
    g.save();g.globalAlpha=fade;g.translate(W/2,152);g.scale(pop,pop);
    const rg=g.createLinearGradient(-86,0,86,0);rg.addColorStop(0,'#ffe27a');rg.addColorStop(1,'#ffb52e');
    g.shadowColor='#ffc83d';g.shadowBlur=16;g.fillStyle=rg;rr(-86,-15,172,30,15);g.fill();g.shadowBlur=0;
    g.fillStyle='#5a3a00';g.font='800 14px system-ui,sans-serif';g.fillText('NEW RECORD!',0,5);
    g.fillStyle='#fff6c8';g.font='14px sans-serif';
    [[-100,-6],[100,-6],[-94,12],[94,12]].forEach(([sx,sy],i)=>{g.globalAlpha=fade*(.5+.5*Math.sin(tw*9+i*1.7));g.fillText('✦',sx,sy)});
    g.restore();
  }
  if(state==='ready'){
    g.fillStyle='#ffffffee';g.font='800 20px system-ui,sans-serif';
    g.fillText('ボタンを押してスタート',W/2,H*.24);
    g.font='13px system-ui,sans-serif';g.fillStyle='#ffffffcc';
    g.fillText('PC: Ctrl=方向転換+1段 / Space=1段',W/2,H*.24+26);
  }
  if(over){
    const py=H*.2;
    const pg2=g.createLinearGradient(0,py,0,py+120);pg2.addColorStop(0,'#0c0f24ee');pg2.addColorStop(1,'#1c1840ee');
    g.fillStyle=pg2;g.strokeStyle='#ff6b6b88';g.lineWidth=1.5;
    rr(W/2-130,py,260,116,18);g.fill();g.stroke();
    g.fillStyle='#ff7b7b';g.font='800 28px system-ui,sans-serif';g.fillText('失敗！',W/2,py+42);
    g.fillStyle='#fff';g.font='600 16px system-ui,sans-serif';g.fillText(reason+' ／ '+n+'段',W/2,py+70);
    g.fillStyle='#a9b2f0';g.font='12px system-ui,sans-serif';
    g.fillText(n>runBest&&n>0?'🎉 NEW RECORD！ '+n+'段':'ベスト '+best+'段 ／ ボタンでリトライ',W/2,py+96);
    if(rankNote){ // ランキング入り: 大きな金色バナー(ポンと弾んで表示)
      const age=(performance.now()-rankAt)/1000,pop=age<.35?.5+.5*Math.sin(age/.35*Math.PI/2)+.12*Math.sin(age/.35*Math.PI):1;
      g.save();g.translate(W/2,py+150);g.scale(pop,pop);
      const rg=g.createLinearGradient(-130,0,130,0);rg.addColorStop(0,'#ffe27a');rg.addColorStop(1,'#ffb52e');
      g.shadowColor='#ffc83d';g.shadowBlur=22;g.fillStyle=rg;rr(-130,-26,260,52,26);g.fill();g.shadowBlur=0;
      g.fillStyle='#5a3a00';g.font='800 24px system-ui,sans-serif';g.fillText(rankNote,0,8);
      g.restore();
    }
  }
}
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
