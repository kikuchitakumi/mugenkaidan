<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>無限階段 練習</title>
<style>
  html,body{margin:0;height:100%;background:#12141c;overflow:hidden;
    touch-action:manipulation;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .btn{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));width:42vw;max-width:260px;height:26vh;max-height:200px;
    border-radius:20px;border:2px solid #fff3;color:#fff;font-size:22px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.3;
    touch-action:none;opacity:.85}
  .btn small{display:block;font-size:13px;font-weight:400;opacity:.8}
  .btn.on{opacity:1;transform:scale(.96);filter:brightness(1.4)}
  #ctrl{left:max(16px,env(safe-area-inset-left));background:#7a3fd1}
  #space{right:max(16px,env(safe-area-inset-right));background:#1f8fd6}
  #mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:44px;height:44px;
    border-radius:50%;border:1.5px solid #ffffff44;background:#ffffff18;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="mute">🔊</div>
<div class="btn" id="ctrl">Ctrl<small>方向転換して1段</small></div>
<div class="btn" id="space">Space<small>そのまま1段</small></div>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

// ズーム防止
['gesturestart','gesturechange','gestureend','contextmenu','dblclick'].forEach(e=>
  document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
let lastTouch=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<350)e.preventDefault();lastTouch=n},{passive:false});
document.addEventListener('touchmove',e=>{e.preventDefault()},{passive:false});

// ゲーム状態
const SW=56,SH=30; // 階段の幅・高さ
let dirs,n,face,state,timer,limit,best,reason,lockUntil,camX,camY,shake;
try{best=+localStorage.getItem('mugen_best')||0}catch(e){best=0}
function limitFor(k){return .35+2.65*Math.exp(-k/70)}
function reset(){dirs=[1];n=0;face=1;state='ready';timer=0;limit=0;reason='';camX=0;camY=0;shake=0;
  while(dirs.length<60)dirs.push(Math.random()<.5?1:-1)}
function stairX(k){let x=0;for(let i=0;i<k;i++)x+=dirs[i];return x}
function fail(r){state='over';reason=r;sfxFail();lockUntil=performance.now()+450;shake=1;
  if(n>best){best=n;try{localStorage.setItem('mugen_best',best)}catch(e){}}}

// 効果音(WebAudioで合成。音源ファイル不要)
let ac=null,muted=false;
try{muted=localStorage.getItem('mugen_mute')==='1'}catch(e){}
const muteEl=document.getElementById('mute');
muteEl.textContent=muted?'🔇':'🔊';
muteEl.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();muted=!muted;
  muteEl.textContent=muted?'🔇':'🔊';try{localStorage.setItem('mugen_mute',muted?'1':'0')}catch(_){}
  if(!muted)tone(660,.08,'triangle',.15)});
function audioInit(){
  if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A()}
  if(ac&&ac.state==='suspended')ac.resume();
}
function tone(f,d,type,vol,f2,delay){
  if(muted||!ac)return;
  const t=ac.currentTime+(delay||0),o=ac.createOscillator(),gn=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.008);
  gn.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(gn).connect(ac.destination);o.start(t);o.stop(t+d+.02);
}
const PENT=[0,2,4,7,9];
function sfxStep(k){
  const semi=PENT[k%5]+(k%10>=5?12:0);
  tone(440*Math.pow(2,semi/12),.11,'triangle',.18);
  if(k%10===0){[0,4,7,12].forEach((s,i)=>tone(660*Math.pow(2,s/12),.25,'sine',.13,0,.07*i))}
}
function sfxFail(){tone(330,.45,'sawtooth',.12,70);tone(165,.45,'square',.07,45)}

function act(turn){
  audioInit();
  const now=performance.now();
  if(state==='over'){if(now>lockUntil)reset();return}
  if(turn)face=-face;
  if(dirs[n]!==face){fail('階段のない方向です');return}
  n++;state='play';sfxStep(n);
  while(dirs.length<n+60)dirs.push(Math.random()<.5?1:-1);
  limit=limitFor(n);timer=limit;
}

// 入力: ボタン
function bind(id,turn){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');act(turn)});
  const up=()=>el.classList.remove('on');
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,up));
}
bind('ctrl',true);bind('space',false);
// 入力: キーボード
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.key==='Control'||e.code==='ControlLeft'||e.code==='ControlRight'){e.preventDefault();act(true)}
  else if(e.code==='Space'){e.preventDefault();act(false)}
});

let prev=performance.now();
function loop(t){
  const dt=Math.min((t-prev)/1000,.1);prev=t;
  if(state==='play'){timer-=dt;if(timer<=0){timer=0;fail('時間切れ')}}
  shake=Math.max(0,shake-dt*3);
  draw();requestAnimationFrame(loop);
}

function draw(){
  g.fillStyle='#12141c';g.fillRect(0,0,W,H);
  const px=stairX(n)*SW,py=-n*SH;
  camX+=(px-camX)*.25;camY+=(py-camY)*.25;
  const ox=W/2-camX+(shake?Math.sin(performance.now()/20)*shake*6:0);
  const oy=H*.5-camY;
  // 階段
  const from=Math.max(0,n-12),to=n+14;
  for(let k=from;k<=to;k++){
    const x=ox+stairX(k)*SW,y=oy-k*SH;
    g.fillStyle=k===n?'#ffd24a':(k<n?'#3a4058':'#5b6488');
    g.fillRect(x-SW/2+2,y,SW-4,SH-4);
    g.fillStyle='#0004';g.fillRect(x-SW/2+2,y+SH-10,SW-4,6);
    if(k%10===0&&k>0){g.fillStyle='#fff';g.font='12px sans-serif';g.textAlign='center';g.fillText(k,x,y+SH-9)}
  }
  // プレイヤー
  const x=ox+px,y=oy+py;
  g.fillStyle=state==='over'?'#e5484d':'#fff';
  g.beginPath();g.arc(x,y-12,11,0,7);g.fill();
  g.fillStyle='#12141c';g.beginPath();g.arc(x+face*5,y-14,3,0,7);g.fill();
  g.fillStyle='#ffd24a';g.font='bold 18px sans-serif';g.textAlign='center';
  g.fillText(face>0?'▶':'◀',x+face*34,y-8);

  // HUD
  g.fillStyle='#fff';g.textAlign='center';g.font='bold 44px sans-serif';
  g.fillText(n,W/2,56);
  g.font='13px sans-serif';g.fillStyle='#aab';g.fillText('BEST '+best,W/2,78);
  const bw=Math.min(W-40,360),bx=(W-bw)/2;
  g.fillStyle='#fff2';g.fillRect(bx,92,bw,8);
  if(state==='play'){
    const r=Math.max(0,timer/limit);
    g.fillStyle=r>.5?'#4ade80':r>.25?'#facc15':'#ef4444';
    g.fillRect(bx,92,bw*r,8);
    g.fillStyle='#aab';g.font='12px sans-serif';g.fillText('制限 '+limit.toFixed(2)+'s',W/2,118);
  }
  if(state==='ready'){
    g.fillStyle='#fffd';g.font='bold 20px sans-serif';
    g.fillText('ボタンを押してスタート',W/2,H*.25);
    g.font='14px sans-serif';g.fillStyle='#aab';
    g.fillText('PC: Ctrl=方向転換+1段 / Space=1段',W/2,H*.25+26);
  }
  if(state==='over'){
    g.fillStyle='#000a';g.fillRect(0,H*.2,W,H*.2);
    g.fillStyle='#ff6b6b';g.font='bold 28px sans-serif';g.fillText('失敗！',W/2,H*.2+44);
    g.fillStyle='#fff';g.font='16px sans-serif';g.fillText(reason+' ／ '+n+'段',W/2,H*.2+72);
    g.fillStyle='#aab';g.font='13px sans-serif';g.fillText('ボタンでリトライ',W/2,H*.2+96);
  }
}
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
